[project]
name = "throughline-model"
version = "0.1.0"
description = "Model provider abstraction (§40), structured output (§41) and prompt versioning (§114)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

# The hosted backend is an extra, not a dependency. A local-first install should
# not pull an API client it will never call, and `anthropic_provider` imports the
# SDK inside the method rather than at module scope so that a workspace without
# this extra still imports the registry and reports the provider unavailable.
[project.optional-dependencies]
anthropic = ["anthropic>=0.69"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
