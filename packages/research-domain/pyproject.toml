[project]
name = "throughline-domain"
version = "0.1.0"
description = "Research object model, lineage, findings and durable workflows"
requires-python = ">=3.12"
dependencies = [
  "throughline-schemas",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "pgserver>=0.1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"throughline_domain" = ["migrations/*.sql"]
