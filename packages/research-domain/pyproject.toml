[project]
name = "throughline-domain"
version = "0.1.0"
description = "Research object model, lineage, findings and durable workflows"
requires-python = ">=3.12"
dependencies = [
  "throughline-schemas",
  "throughline-visual",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "pgserver>=0.1.4",
  # render_artifact imports both directly. python-docx was reaching this package
  # only because throughline-ingestion happens to depend on it, which held by
  # accident rather than by declaration; python-pptx was declared nowhere at all,
  # so every PPTX export raised ModuleNotFoundError.
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
]

[project.optional-dependencies]
# ADR 0002 — the graph projection is derived and never the source of a fact, so
# the driver is a choice rather than a requirement. graph_projection reports its
# absence as unavailability and answers everything on the provenance path from
# PostgreSQL regardless.
graph = ["neo4j>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"throughline_domain" = ["migrations/*.sql"]
