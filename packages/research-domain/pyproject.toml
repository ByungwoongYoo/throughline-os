[project]
name = "throughline-domain"
version = "0.1.0"
description = "Research object model, lineage, findings and durable workflows"
requires-python = ">=3.12"
dependencies = [
  "throughline-schemas",
  "throughline-visual",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "pgserver>=0.1.4",
  # render_artifact imports both directly. python-docx was reaching this package
  # only because throughline-ingestion happens to depend on it, which held by
  # accident rather than by declaration; python-pptx was declared nowhere at all,
  # so every PPTX export raised ModuleNotFoundError.
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  # embedding_space projects 256-dimension vectors to three for display. Declared
  # rather than borrowed: numpy reaches this package today only because
  # throughline-ingestion happens to depend on it, which is precisely the
  # accident the two lines above were written about.
  "numpy>=1.26",
  # Real haptic feedback, on the one platform that offers a program any.
  # macOS-only by marker rather than by a try/except at install time: on Linux
  # and Windows this simply is not installed, and `haptics.capability()` reports
  # that the machine has no actuator — which is true and is the common case.
  'pyobjc-framework-Cocoa>=10.0; sys_platform == "darwin"',
]

[project.optional-dependencies]
# ADR 0002 — the graph projection is derived and never the source of a fact, so
# the driver is a choice rather than a requirement. graph_projection reports its
# absence as unavailability and answers everything on the provenance path from
# PostgreSQL regardless.
graph = ["neo4j>=5"]

# Local speech recognition (§38). Optional for the same reason as the graph
# driver, and more so: it pulls in torch, which is gigabytes. Everything except
# actual transcription works without it — `speech.transcribe` validates and
# refuses malformed audio before the model is touched, and the import is lazy —
# so a clone that never installs this still runs the whole suite, with the
# transcription tests skipped rather than failed.
speech = ["openai-whisper>=20250625"]

# Reading points off a published figure, and comparing two images. Both already
# import cv2 lazily and raise a DigitiseError naming OpenCV when it is missing, so
# the capability degrades the way a missing embedding model does. Declared here so
# there is a documented way to turn it on rather than a library you have to
# discover from a stack trace. Headless: this is a backend, and the GUI build
# drags in system libraries a researcher's machine should not need.
digitise = ["opencv-python-headless>=4.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"throughline_domain" = ["migrations/*.sql"]
