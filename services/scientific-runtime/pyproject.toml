[project]
name = "throughline-runtime"
version = "0.1.0"
description = "Isolated scientific computation (§43) and the statistical result contract (§47)"
requires-python = ">=3.12"
dependencies = [
  "throughline-schemas",
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
