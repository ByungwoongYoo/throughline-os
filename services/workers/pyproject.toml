[project]
name = "throughline-workers"
version = "0.1.0"
description = "Durable background workers"
requires-python = ">=3.12"
dependencies = ["throughline-domain", "throughline-schemas", "throughline-ingestion", "throughline-runtime"]

[project.scripts]
throughline-worker = "throughline_workers.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
